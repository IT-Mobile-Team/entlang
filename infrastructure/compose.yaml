services:
  db:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: passw0rd #leave it for dev purposes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: on-failure
  backend:
    build:
      context: ../apps/api
      dockerfile: .
    depends_on:
    - db
    container_name: backend
    ports:
      - "3000:3000"
    restart: on-failure
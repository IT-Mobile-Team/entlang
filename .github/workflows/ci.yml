name: CI

on:
  pull_request:
    branches: [main, develop]
    # ready_for_review: CI starts as soon as a draft is marked "Ready for review"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]

permissions:
  contents: read

# Cancel the previous run when a new push hits the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    # Skip on draft PRs to save runner minutes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build (includes typecheck)
        run: npm run build

      - name: Test
        run: npm test

  # Add later for the React Native app (lint, typecheck, Jest), e.g.:
  # mobile:
  #   name: mobile
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: apps/mobile
  #   steps: ...
  # and add "mobile" to needs below.

  # Aggregate check: only "build" is set as a required check in the ruleset.
  # New jobs go into "needs"; the ruleset does not need to change.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [api]
    # always(): runs even if a job fails. Also skipped on drafts.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one CI job failed ($r)"
              exit 1
            fi
          done
